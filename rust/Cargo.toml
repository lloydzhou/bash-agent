[package]
name = "rustagent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
once_cell = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustyline = "14"
ctrlc = "3"
crossterm = "0.28"
time = { version = "0.3.47", features = ["formatting", "macros"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
