[package]
name = "rustagent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
once_cell = "1"
base64 = "0.22"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

crossterm = "0.28"
nix = "0.31"
libc = "0.2"
time = { version = "0.3.47", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
ctrlc = "3"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
