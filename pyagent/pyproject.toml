[project]
name = "pyagent"
version = "0.1.0"
description = "AI coding agent — Python port of bash-agent"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
]

[project.scripts]
pyagent = "pyagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyagent"]
artifacts = ["pyagent/tools.json"]
