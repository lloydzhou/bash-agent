name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  bash-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep gawk locales
          sudo locale-gen en_US.UTF-8
          mkdir -p .ci-bin
          cat > .ci-bin/awk <<'EOF'
          #!/usr/bin/env bash
          exec env LC_ALL=C LANG=C gawk "$@"
          EOF
          chmod +x .ci-bin/awk
          echo "$PWD/.ci-bin" >> "$GITHUB_PATH"

      - name: Build bash artifact
        run: make build-bash

      - name: Test dist/agent.sh
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          PYTHONUTF8: "1"
        run: AGENT=./dist/agent.sh bash tests/test.sh

      - name: Upload agent.sh
        uses: actions/upload-artifact@v4
        with:
          name: agent-sh
          path: dist/agent.sh

  goagent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux-amd64
            ext: ""
            cc: gcc
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: linux-arm64
            ext: ""
            cc: aarch64-linux-gnu-gcc
          - runner: macos-14
            goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            ext: ""
            cc: cc
          - runner: macos-14
            goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            ext: ""
            cc: cc
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Run Go tests (linux amd64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: make test-go

      - name: Install cross linker (linux arm64)
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build goagent
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CC=${{ matrix.cc }} \
            go -C go build -ldflags="-s -w" -o ../dist/goagent-${{ matrix.suffix }}${{ matrix.ext }} ./cmd/goagent

      - name: Upload goagent
        uses: actions/upload-artifact@v4
        with:
          name: goagent-${{ matrix.suffix }}
          path: dist/goagent-${{ matrix.suffix }}${{ matrix.ext }}

  rustagent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-amd64
            bin: rustagent
            ext: ""
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
            bin: rustagent
            ext: ""
          - runner: macos-14
            target: aarch64-apple-darwin
            suffix: darwin-arm64
            bin: rustagent
            ext: ""
          - runner: macos-14
            target: x86_64-apple-darwin
            suffix: darwin-amd64
            bin: rustagent
            ext: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check Rust code (linux only)
        if: matrix.runner == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: make test-rust

      - name: Install cross linker (linux arm64 target)
        if: matrix.runner == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build rustagent
        run: |
          mkdir -p dist
          if [ "${{ matrix.runner }}" = "ubuntu-latest" ] && [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cd rust && cargo build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} ../dist/rustagent-${{ matrix.suffix }}${{ matrix.ext }}

      - name: Upload rustagent
        uses: actions/upload-artifact@v4
        with:
          name: rustagent-${{ matrix.suffix }}
          path: dist/rustagent-${{ matrix.suffix }}${{ matrix.ext }}

  cagent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            suffix: linux-amd64
            cc: gcc
          - runner: ubuntu-latest
            suffix: linux-arm64
            cc: aarch64-linux-gnu-gcc
          - runner: macos-14
            suffix: darwin-arm64
            cc: cc
          - runner: macos-14
            suffix: darwin-amd64
            cc: cc
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev ripgrep
          if [ "${{ matrix.suffix }}" = "linux-arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            # 备份并重写 sources.list，只保留 amd64
            sudo cp /etc/apt/sources.list /etc/apt/sources.list.bak
            sudo bash -c 'cat > /etc/apt/sources.list << EOF
deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse
deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse
deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble-backports main restricted universe multiverse
deb [arch=amd64] http://security.ubuntu.com/ubuntu noble-security main restricted universe multiverse
EOF'
            # 添加 arm64 架构支持（使用 ports 源）
            sudo dpkg --add-architecture arm64
            echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse' | sudo tee /etc/apt/sources.list.d/arm64-ports.list
            echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse' | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list
            echo 'deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse' | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list
            sudo apt-get update
            sudo apt-get install -y libcurl4-openssl-dev:arm64
          fi

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install curl

      - name: Build cagent
        run: |
          mkdir -p dist
          if [ "${{ matrix.suffix }}" = "linux-arm64" ]; then
            make -C c CC=${{ matrix.cc }} 'LDFLAGS=-L/usr/lib/aarch64-linux-gnu -lcurl -lpthread'
          elif [ "${{ matrix.suffix }}" = "darwin-amd64" ]; then
            make -C c CC=${{ matrix.cc }} 'CFLAGS=-std=c11 -Wall -Wextra -Wno-unused-parameter -O2 -D_GNU_SOURCE -arch x86_64 -Ivendor/linenoise' 'LDFLAGS=-lcurl -arch x86_64'
          else
            make -C c CC=${{ matrix.cc }}
          fi
          mv dist/cagent dist/cagent-${{ matrix.suffix }}

      - name: Test cagent (linux amd64 only)
        if: matrix.suffix == 'linux-amd64'
        run: |
          cp dist/cagent-linux-amd64 dist/cagent
          AGENT=./dist/cagent bash tests/test.sh

      - name: Upload cagent
        uses: actions/upload-artifact@v4
        with:
          name: cagent-${{ matrix.suffix }}
          path: dist/cagent-${{ matrix.suffix }}

  tcode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy tcode
        run: |
          mkdir -p dist
          cp scripts/tcode dist/tcode
          chmod +x dist/tcode

      - name: Upload tcode
        uses: actions/upload-artifact@v4
        with:
          name: tcode
          path: dist/tcode

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bash-agent, goagent, rustagent, cagent, tcode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show artifacts
        run: ls -lh dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agent.sh
            dist/goagent-linux-amd64
            dist/goagent-linux-arm64
            dist/goagent-darwin-amd64
            dist/goagent-darwin-arm64
            dist/rustagent-linux-amd64
            dist/rustagent-linux-arm64
            dist/rustagent-darwin-amd64
            dist/rustagent-darwin-arm64
            dist/cagent-linux-amd64
            dist/cagent-linux-arm64
            dist/cagent-darwin-amd64
            dist/cagent-darwin-arm64
            dist/tcode
