name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  bash-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep gawk locales
          sudo locale-gen en_US.UTF-8
          mkdir -p .ci-bin
          cat > .ci-bin/awk <<'EOF'
          #!/usr/bin/env bash
          exec env LC_ALL=C LANG=C gawk "$@"
          EOF
          chmod +x .ci-bin/awk
          echo "$PWD/.ci-bin" >> "$GITHUB_PATH"

      - name: Build bash artifact
        run: make build-bash

      - name: Test dist/agent.sh
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          PYTHONUTF8: "1"
        run: AGENT=./dist/agent.sh bash tests/test.sh

      - name: Upload agent.sh
        uses: actions/upload-artifact@v4
        with:
          name: agent-sh
          path: dist/agent.sh

  goagent:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            ext: ""
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            ext: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Run Go tests (linux only)
        if: matrix.goos == 'linux'
        run: make test-go

      - name: Download and patch go-prompt dependency
        run: |
          go -C go mod download
          bash scripts/patch-go-prompt.sh "$(go -C go env GOMODCACHE)"

      - name: Build goagent
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go -C go build -ldflags="-s -w" -o ../dist/goagent-${{ matrix.suffix }}${{ matrix.ext }} ./cmd/goagent

      - name: Upload goagent
        uses: actions/upload-artifact@v4
        with:
          name: goagent-${{ matrix.suffix }}
          path: dist/goagent-${{ matrix.suffix }}${{ matrix.ext }}

  rustagent:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-amd64
            bin: rustagent
            ext: ""
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
            bin: rustagent
            ext: ""
          - runner: macos-14
            target: aarch64-apple-darwin
            suffix: darwin-arm64
            bin: rustagent
            ext: ""
          - runner: macos-14
            target: x86_64-apple-darwin
            suffix: darwin-amd64
            bin: rustagent
            ext: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check Rust code (linux only)
        if: matrix.runner == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: make test-rust

      - name: Install cross linker (linux arm64 target)
        if: matrix.runner == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build rustagent
        run: |
          mkdir -p dist
          if [ "${{ matrix.runner }}" = "ubuntu-latest" ] && [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cd rust && cargo build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} ../dist/rustagent-${{ matrix.suffix }}${{ matrix.ext }}

      - name: Upload rustagent
        uses: actions/upload-artifact@v4
        with:
          name: rustagent-${{ matrix.suffix }}
          path: dist/rustagent-${{ matrix.suffix }}${{ matrix.ext }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bash-agent, goagent, rustagent]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show artifacts
        run: ls -lh dist

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agent.sh
            dist/goagent-linux-amd64
            dist/goagent-linux-arm64
            dist/goagent-darwin-amd64
            dist/goagent-darwin-arm64
            dist/rustagent-linux-amd64
            dist/rustagent-linux-arm64
            dist/rustagent-darwin-amd64
            dist/rustagent-darwin-arm64
